<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.css">
<style>html, body, #dos { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
#msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #a1a1aa; font: 13px system-ui, sans-serif; }</style>
</head>
<body>
<div id="dos"></div>
<div id="msg">Starting…</div>
<script src="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.js" onerror="document.getElementById('msg').textContent = 'Could not load the DOS emulator. Check your connection and try again.'"></script>
<script>
  // Runs one js-dos bundle from this folder: player.html?game=doom
  const game = new URLSearchParams(location.search).get('game');
  if (window.Dos && /^[a-z0-9]+$/.test(game || '')) {
    document.getElementById('msg').remove();
    Dos(document.getElementById('dos'), {
      url: game + '.jsdos', pathPrefix: 'https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/emulators/',
      autoStart: true, kiosk: true, theme: 'dark', noCloud: true, noNetworking: true,
    });
  }
</script>
</body>
</html>
