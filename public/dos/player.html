<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.css">
<style>html, body, #dos { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
#msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #a1a1aa; font: 13px system-ui, sans-serif; }</style>
</head>
<body>
<div id="dos"></div>
<div id="msg">Starting…</div>
<script>// Keyboard Lock only works in a top-level page; inside the OS window it would just throw.
if (navigator.keyboard && window.top !== window) navigator.keyboard.lock = () => Promise.resolve();</script>
<script src="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.js" onerror="document.getElementById('msg').textContent = 'Could not load the DOS emulator. Check your connection and try again.'"></script>
<script>
  // Runs one js-dos bundle from this folder: player.html?game=doom
  // Right-click is a game control (Doom fires with it), so keep the browser menu out of the way.
  addEventListener('contextmenu', e => e.preventDefault());
  // ?game=doom plays a bundled game; ?bundle=<blob: URL> plays a bundle the OS built from your own files.
  (() => { // own scope: js-dos defines short global names
  const params = new URLSearchParams(location.search), game = params.get('game'), bundle = params.get('bundle');
  const url = /^[a-z0-9]+$/.test(game || '') ? game + '.jsdos' : bundle && bundle.startsWith('blob:' + location.origin) ? bundle : null;
  if (window.Dos && url) {
    document.getElementById('msg').remove();
    Dos(document.getElementById('dos'), {
      url, pathPrefix: 'https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/emulators/',
      autoStart: true, kiosk: true, theme: 'dark', noCloud: true, noNetworking: true,
    });
  }
  })();
</script>
</body>
</html>
