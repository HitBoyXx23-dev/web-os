<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/os.css">
</head>
<body>
<template id="mark-tpl">
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="11" height="11" rx="3" fill="currentColor"/><rect x="18" y="3" width="11" height="11" rx="3" fill="currentColor" opacity=".5"/><rect x="3" y="18" width="11" height="11" rx="3" fill="currentColor" opacity=".5"/><rect x="18" y="18" width="11" height="11" rx="3" fill="currentColor"/></svg>
</template>

<div id="boot">
  <div class="mark-slot" style="color:#fff"></div>
  <div class="spinner"></div>
  <div id="boot-status"></div>
</div>

<div id="login" class="hidden">
  <div class="login-time"><div id="login-clock"></div><div id="login-date"></div></div>
  <form class="login-card" id="login-form">
    <div class="avatar" id="login-avatar"></div>
    <div class="login-row">
      <input id="login-name" placeholder="Name" maxlength="20" autocomplete="off" spellcheck="false">
      <button type="submit" aria-label="Sign in" id="login-go"></button>
    </div>
  </form>
</div>

<div id="desktop" class="hidden">
  <div id="icons"></div>
  <div id="windows"></div>

  <div id="start-menu" class="flyout hidden">
    <div class="start-search"><span id="ss-icon"></span><input id="start-search" placeholder="Search apps, games and settings" spellcheck="false"></div>
    <div id="start-list"></div>
    <div class="start-footer">
      <div class="user-chip"><span class="av" id="start-av"></span><span id="start-user"></span></div>
      <button class="icon-btn" id="power-btn" title="Power"></button>
    </div>
  </div>
  <div id="power-menu" class="flyout menu hidden"></div>
  <div id="ctx-menu" class="flyout menu hidden"></div>
  <div id="quick" class="flyout hidden"></div>

  <div id="taskbar">
    <button class="tb-btn" id="start-btn" title="Start (Ctrl+Space)"></button>
    <div id="task-items"></div>
    <div id="tray">
      <button class="tb-btn" id="tray-status" title="Quick settings"></button>
      <button class="tb-btn" id="clock" title="Calendar"></button>
    </div>
  </div>
</div>

<div id="off" class="hidden"><div class="mark-slot" style="color:#3f3f46"></div><button class="ghost" onclick="location.reload()" style="color:#a1a1aa">Power on</button></div>

<script src="uv/uv.bundle.js"></script>
<script src="uv/uv.config.js"></script>
<script src="baremux/index.js"></script>
<script src="js/icons.js"></script>
<script src="js/fs.js"></script>
<script src="js/wm.js"></script>
<script src="js/games.js"></script>
<script src="js/browser.js"></script>
<script src="js/apps.js"></script>
<script src="js/os.js"></script>
</body>
</html>
