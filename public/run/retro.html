<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Retro console</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } #game { width: 100%; height: 100%; }</style></head>
<body><div id="game"></div>
<script>
  // Plays a console game file you own with EmulatorJS (RetroArch cores in WebAssembly).
  const q = new URLSearchParams(location.search), src = q.get('src'), core = q.get('core');
  if (src && src.startsWith('blob:' + location.origin) && /^[a-zA-Z0-9]+$/.test(core || '')) {
    window.EJS_player = '#game'; window.EJS_core = core; window.EJS_gameUrl = src; window.EJS_gameName = q.get('name') || 'game';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; window.EJS_startOnLoaded = true; window.EJS_color = '#3b82f6';
    const s = document.createElement('script'); s.src = EJS_pathtodata + 'loader.js'; document.body.appendChild(s);
  }
</script>
</body></html>
